plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.scrumai'
version = '0.0.1-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.8'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.projectlombok:lombok:1.18.42'
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    apply from: rootProject.file('config/quality.gradle')
}

tasks.register('formatCode') {
    group = 'formatting'
    description = 'Formats all project sources.'
    dependsOn subprojects.collect { "${it.path}:spotlessApply" }
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs formatting, tests, coverage, and static analysis.'
    dependsOn subprojects.collect { "${it.path}:check" }
    dependsOn subprojects.collect { "${it.path}:jacocoTestReport" }
}
