spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: scrum-ai-backend
  datasource:
    url: ${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/scrum_ai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    # The existing manually-created Neon schema is baselined at V1 before V2 runs.
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${APP_JWT_SECRET:}
    jwt-issuer: ${APP_JWT_ISSUER:scrum-ai}
    service-token: ${APP_SERVICE_TOKEN:}
    bootstrap-admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:}

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
