server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /api/v1/transactions/evaluate {
    set $aegis_service_token "${APP_SERVICE_TOKEN}";
    if ($aegis_service_token = "") { return 503; }
    limit_except POST { deny all; }
    auth_request /_aegis/evaluation-auth;
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header X-Service-Token $aegis_service_token;
  }

  location = /_aegis/evaluation-auth {
    internal;
    proxy_pass http://backend:8080/api/v1/auth/me;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Service-Token "";
    proxy_set_header Origin "";
  }

  location ~ ^/(api/|swagger-ui(?:/|\.html$)|v3/api-docs(?:/|$)) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Browser requests are same-origin. This hop is internal server-to-server traffic.
    proxy_set_header Origin "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
