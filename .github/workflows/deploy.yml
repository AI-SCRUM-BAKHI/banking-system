name: CI/CD & Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon clean qualityGate :app-bootstrap:bootJar
      - name: Verify deployment readiness handling
        run: |
          bash -n ../infra/deploy.sh
          python3 -m unittest discover -s ../infra/tests -p 'test_*.py' -q

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 Connecting to server..."
            TARGET_DIR="${{ secrets.TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/banking-system"
            fi

            echo "📁 Navigating to project directory: $TARGET_DIR"
            cd "$TARGET_DIR"

            echo "🔄 Fetching and resetting to latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            bash infra/deploy.sh

