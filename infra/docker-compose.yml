services:
  backend:
    container_name: scrum-ai-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
  frontend:
    container_name: scrum-ai-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Banking Fraud Detection}
    depends_on:
      - backend
    ports:
      - "5173:80"
